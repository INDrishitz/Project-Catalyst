version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chroma_db:/chroma_db
      - ./data:/data
    container_name: rag-backend

  frontend:
    build: 
      context: ./frontend
    ports:
      - "3000:80"  # This is the critical missing piece!
    container_name: rag-frontend
    depends_on:
      - backend